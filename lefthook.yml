pre-commit:
  commands:
    lint-ts:
      glob: "*.ts"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,md,yaml,yml,json}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
